<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#174d36"><title>樹種調査判定</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--forest:#174d36;--forest2:#26734b;--ink:#172b20;--muted:#68786e;--paper:#f3f7f2;--white:#fff;--line:#dfe9df;--blue:#c9defa;--blueInk:#174f87;--green:#c5e8cf;--greenInk:#185b2f;--orange:#f8d2a6;--orangeInk:#85440f;--shadow:0 12px 32px rgba(20,61,38,.08)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0%,#e3efe5 0,transparent 42%),var(--paper);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}header{background:linear-gradient(125deg,#123f2c,#26764c);color:#fff;padding:25px 20px 34px;position:relative;overflow:hidden}header:after{content:"";position:absolute;right:-35px;top:-65px;width:230px;height:230px;border:1px solid rgba(255,255,255,.12);border-radius:50%;box-shadow:0 0 0 28px rgba(255,255,255,.035),0 0 0 58px rgba(255,255,255,.025)}.head{max-width:850px;margin:auto;position:relative;z-index:1}.brand{display:flex;align-items:center;gap:11px}.logo{width:43px;height:43px;border-radius:14px;background:#ffffff20;display:grid;place-items:center;font-size:24px;border:1px solid #ffffff30}h1{font-size:1.35rem;margin:0;font-weight:800;letter-spacing:.02em}header p{margin:10px 0 0;color:#d7eadc;font-size:.93rem}.wrap{max-width:850px;margin:-18px auto 0;padding:0 14px 44px;position:relative}.searchPanel{background:#fff;border-radius:20px;border:1px solid #e1eae1;box-shadow:var(--shadow);padding:18px;margin-bottom:16px}.labelrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.labelrow label{font-weight:800;font-size:.98rem}.pill{background:#eef5ef;color:#356847;border-radius:99px;padding:5px 9px;font-size:.75rem;font-weight:750}.searchbox{position:relative}.searchbox input{width:100%;border:2px solid #dce8dd;border-radius:15px;background:#fbfdfb;padding:15px 50px 15px 15px;font-size:1.1rem;outline:none;transition:.15s}.searchbox input:focus{border-color:#3c875b;box-shadow:0 0 0 4px #3c875b20}.searchicon{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:1.3rem;color:#67816d}.hint{color:var(--muted);font-size:.82rem;margin:9px 2px 0}.clear{border:0;background:#eef3ef;color:#4b6653;padding:7px 10px;border-radius:9px;font-weight:700;cursor:pointer}.results{display:grid;gap:13px}.speciesCard{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 18px rgba(21,56,34,.045);overflow:hidden}.speciesTop{padding:17px 18px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.speciesTop h2{font-size:1.3rem;margin:0;letter-spacing:.02em}.category{display:inline-flex;align-items:center;gap:6px;margin-top:7px;font-size:.8rem;font-weight:800;padding:5px 9px;border-radius:999px;background:#eef4ef;color:#315b3c}.category.high{background:#e8f3e8;color:#28623b}.category.middle{background:#f0eafb;color:#6c4b9b}.category.low{background:#f2f0e8;color:#6f6651}.matchBadge{font-size:.75rem;color:#7a8b7e;background:#f5f8f5;padding:6px 9px;border-radius:99px;white-space:nowrap}.conditions{padding:0 13px 14px;display:grid;grid-template-columns:1fr;gap:10px}.condition{border-radius:14px;padding:15px 15px 14px;border:1px solid transparent;box-shadow:inset 5px 0 0 currentColor}.condition h3{margin:0 0 9px;font-size:.95rem}.verdict{font-weight:900;font-size:1.23rem;line-height:1.4}.desc{font-size:.83rem;line-height:1.5;margin-top:6px;opacity:.9}.blue{background:var(--blue);color:var(--blueInk);border-color:#92bce8}.green{background:var(--green);color:var(--greenInk);border-color:#83c59a}.orange{background:var(--orange);color:var(--orangeInk);border-color:#e9b77e}.dbh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;padding-top:11px;border-top:1px solid currentColor}.dbh label{font-size:.83rem;font-weight:750}.dbh select,.dbh input{border:1px solid #e2c6a9;border-radius:9px;padding:9px 10px;background:#fff;color:#26382b;font-size:1rem}.dbh input{width:125px}.dbhOutput{font-weight:850;margin-top:9px;font-size:.95rem}.note{padding:12px 16px;background:#f7faf7;color:#6a786e;border-top:1px solid #edf2ed;font-size:.78rem;line-height:1.55}.empty{background:#fff;border:1px dashed #cddbcf;padding:18px;border-radius:14px;color:#66756a}.empty strong{display:block;color:#344b3b;margin-bottom:4px}.manage{margin-top:17px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}.manage summary{cursor:pointer;font-weight:800;color:#355d40}.manage p{font-size:.82rem;color:var(--muted);line-height:1.55}.fileRow{display:flex;flex-wrap:wrap;gap:8px}.fileRow button,.fileLabel{border:0;border-radius:10px;background:#edf4ee;color:#28543a;padding:10px 12px;font-weight:750;cursor:pointer}.fileLabel input{display:none}.status{font-size:.8rem;color:var(--muted);margin-top:9px}.footer{text-align:center;color:#809087;font-size:.76rem;margin-top:20px}.intro{color:#66756b;font-size:.82rem;margin:0 3px 8px}.noMatch{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;color:#5e6c62}.noMatch strong{color:#293e30}
@media(min-width:660px){.speciesTop{padding:20px 20px 13px}.searchPanel{padding:21px}}
</style></head><body>
<header><div class="head"><div class="brand"><div class="logo">🌲</div><div><h1>樹種調査判定</h1><div style="font-size:.78rem;color:#d9ebdf;margin-top:2px">FIELD SPECIES CHECK</div></div></div><p>樹種名を入力すると、計測条件をすぐに確認できます。</p></div></header>
<main class="wrap"><section class="searchPanel"><div class="labelrow"><label for="speciesSearch">樹種名で検索</label><span class="pill" id="dbCount">データ読み込み中</span></div><div class="searchbox"><input id="speciesSearch" type="search" placeholder="例：スギ、トベラ" autocomplete="off" autocapitalize="off"><span class="searchicon">⌕</span></div><button class="clear" id="clearBtn" type="button" style="margin-top:10px">入力をクリア</button></section>
<div id="results" class="results" aria-live="polite"></div>
<section class="manage"><details><summary>樹種データの更新・管理</summary><p>Excel（樹種区分・樹種名・別名①～③）またはJSONを読み込むと、このブラウザ内の判定データを差し替えます。差し替え内容はこの端末に保存されます。</p><div class="fileRow"><label class="fileLabel">Excelデータを読み込む（.xlsx）<input id="excelUpload" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></label><label class="fileLabel">JSONデータを読み込む<input id="jsonUpload" type="file" accept="application/json,.json"></label><button id="downloadBtn">現在のデータを保存</button><button id="resetDbBtn">標準データに戻す</button></div><div class="status" id="dbStatus"></div></details></section><div class="footer">判定は登録データに基づきます。未登録の樹種は推定せず、要確認として表示します。</div></main>
<script>
const search=document.getElementById('speciesSearch'),results=document.getElementById('results'),status=document.getElementById('dbStatus'),dbCount=document.getElementById('dbCount');
let speciesData=[],baseData=[];
const normalize=s=>String(s||'').trim().toLowerCase().replace(/[\s　・]/g,'');
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function categoryInfo(cat){const c=String(cat||'');if(c.includes('低木'))return{label:'低木性樹種',cls:'low',type:'low'};if(c.includes('中木'))return{label:'中木性樹種',cls:'middle',type:'middle'};if(c.includes('高木'))return{label:'高木性樹種',cls:'high',type:'high'};return{label:cat||'区分未登録',cls:'',type:'unknown'};}
function card(s,idx,matchCount){const info=categoryInfo(s.category||s.type||'');let conditions='';if(info.type==='low'){conditions=`<div class="condition orange"><h3>樹種区分による判定</h3><div class="verdict">計測対象外</div><div class="desc">低木性樹種のため、計測対象外です。</div></div>`}
else if(info.type==='middle'||info.type==='high'){const under=info.type==='middle'?'計測対象外':'計測対象';const underDetail=info.type==='middle'?'樹高3m未満の場合は計測対象外':'高木性樹種は3m未満でも計測対象';conditions=`<div class="condition blue"><h3>① 3m未満の場合</h3><div class="verdict">${under}</div><div class="desc">${underDetail}</div></div><div class="condition green"><h3>② 3m以上・一般部</h3><div class="verdict">計測対象</div><div class="desc">樹高3m以上の一般部</div></div><div class="condition orange"><h3>③ 3m以上・樹林部</h3><div class="verdict">胸高直径5cm（又は10cm）以上の場合、計測対象</div><div class="desc">適用される胸高直径基準を調査条件に従って確認してください。</div></div>`}
else{conditions=`<div class="condition orange"><h3>判定</h3><div class="verdict">区分未登録・要確認</div><div class="desc">正式な区分データを確認してください。</div></div>`}
return `<article class="speciesCard" data-index="${idx}"><div class="speciesTop"><div><h2>${esc(s.name||s.species)}</h2><span class="category ${info.cls}">${esc(info.label)}</span></div>${matchCount>1?`<span class="matchBadge">検索結果</span>`:''}</div><div class="conditions">${conditions}</div></article>`;}
function editDistance(a,b){const aa=[...a],bb=[...b];let prev=Array.from({length:bb.length+1},(_,i)=>i);for(let i=1;i<=aa.length;i++){let cur=[i];for(let j=1;j<=bb.length;j++)cur[j]=Math.min(cur[j-1]+1,prev[j]+1,prev[j-1]+(aa[i-1]===bb[j-1]?0:1));prev=cur;}return prev[bb.length];}
function render(){const q=normalize(search.value);results.innerHTML='';if(!q){results.innerHTML=`<div class="empty"><strong>樹種名を入力してください</strong>入力に合わせて、計測条件を自動表示します。</div>`;return;}
const exact=speciesData.filter(s=>normalize(s.name||s.species)===q||(s.aliases||[]).some(a=>normalize(a)===q));
const partial=speciesData.filter(s=>normalize(s.name||s.species).includes(q)||(s.aliases||[]).some(a=>normalize(a).includes(q)));
let found=exact.length?exact:partial;
if(!found.length&&q.length>=2){const maxDist=q.length<=3?1:2;found=speciesData.map(s=>{const names=[s.name||s.species,...(s.aliases||[])].map(normalize);const distance=Math.min(...names.map(n=>editDistance(q,n)));return {s,d:distance};}).filter(x=>x.d<=maxDist).sort((a,b)=>a.d-b.d).slice(0,10).map(x=>x.s);}
if(!found.length){results.innerHTML=`<div class="noMatch"><strong>該当する樹種が見つかりません</strong>データ未登録の可能性があります。樹種名を確認してください。判定は自動推定しません。</div>`;return;}
found.forEach((s,i)=>results.insertAdjacentHTML('beforeend',card(s,i,found.length)));
}
function toAppData(arr){return arr.map(s=>({name:s.name||s.species,aliases:s.aliases||[],category:s.category,mode:'category'}));}
search.addEventListener('input',render);document.getElementById('clearBtn').addEventListener('click',()=>{search.value='';render();search.focus();});
// XLSX import: read ZIP entries and workbook XML without external libraries (modern browser required).
async function unzipTextEntries(file){
 const buf=await file.arrayBuffer(),dv=new DataView(buf),u8=new Uint8Array(buf);
 const decoder=new TextDecoder('utf-8');let eocd=-1;
 for(let i=u8.length-22;i>=Math.max(0,u8.length-65558);i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}}
 if(eocd<0)throw Error('ExcelファイルのZIP構造を読み取れません');
 const count=dv.getUint16(eocd+10,true),cdOffset=dv.getUint32(eocd+16,true);let pos=cdOffset;const entries={};
 for(let n=0;n<count;n++){
  if(dv.getUint32(pos,true)!==0x02014b50)throw Error('ZIP内のファイル情報が不正です');
  const method=dv.getUint16(pos+10,true),compSize=dv.getUint32(pos+20,true),nameLen=dv.getUint16(pos+28,true),extraLen=dv.getUint16(pos+30,true),commentLen=dv.getUint16(pos+32,true),localOffset=dv.getUint32(pos+42,true);
  const name=decoder.decode(u8.slice(pos+46,pos+46+nameLen));const localNameLen=dv.getUint16(localOffset+26,true),localExtraLen=dv.getUint16(localOffset+28,true),start=localOffset+30+localNameLen+localExtraLen;const compressed=u8.slice(start,start+compSize);
  let content;if(method===0)content=compressed;else if(method===8){if(typeof DecompressionStream==='undefined')throw Error('このブラウザはExcel取り込みに必要な解凍機能に対応していません');const ds=new DecompressionStream('deflate-raw');content=new Uint8Array(await new Response(new Blob([compressed]).stream().pipeThrough(ds)).arrayBuffer());}else throw Error('対応していないExcel圧縮方式です');
  entries[name]=decoder.decode(content);pos+=46+nameLen+extraLen+commentLen;
 }
 return entries;
}
function parseExcelXML(xml){return new DOMParser().parseFromString(xml,'application/xml');}
function cellCol(ref){let n=0;for(const c of ref.match(/[A-Z]+/)[0])n=n*26+c.charCodeAt(0)-64;return n;}
async function importExcelFile(file){
 const entries=await unzipTextEntries(file);const wb=parseExcelXML(entries['xl/workbook.xml']);const rels=parseExcelXML(entries['xl/_rels/workbook.xml.rels']);
 const sheet=wb.getElementsByTagName('sheet')[0];if(!sheet)throw Error('ワークシートが見つかりません');const relId=sheet.getAttribute('r:id');let target='xl/worksheets/sheet1.xml';
 for(const rel of rels.getElementsByTagName('Relationship'))if(rel.getAttribute('Id')===relId){let t=rel.getAttribute('Target').replace(/^\//,'');target=t.startsWith('xl/')?t:'xl/'+t;break;}
 const sheetDoc=parseExcelXML(entries[target]);if(!sheetDoc.documentElement||sheetDoc.getElementsByTagName('parsererror').length)throw Error('シートXMLを解析できません');
 let shared=[];if(entries['xl/sharedStrings.xml']){const ss=parseExcelXML(entries['xl/sharedStrings.xml']);shared=[...ss.getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join(''));}
 const rows=[...sheetDoc.getElementsByTagName('row')];let category='',data=[];
 for(const row of rows){let vals={};for(const cell of row.getElementsByTagName('c')){const ref=cell.getAttribute('r'),col=cellCol(ref),type=cell.getAttribute('t'),v=cell.getElementsByTagName('v')[0];let value='';if(type==='inlineStr')value=[...cell.getElementsByTagName('t')].map(t=>t.textContent).join('');else if(v){value=v.textContent;if(type==='s')value=shared[Number(value)]||'';}vals[col]=String(value||'').trim();}
  if(vals[1]&&vals[1]!=='区分')category=vals[1];const name=vals[2];if(!name||name==='樹種名（169種）')continue;const aliases=[vals[4],vals[5],vals[6]].filter(Boolean);data.push({name,aliases,category,mode:'category'});
 }
 if(!data.length)throw Error('樹種名が見つかりません。Excelの列構成（区分・樹種名・別名①～③）を確認してください');
 return data;
}
document.getElementById('excelUpload').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const imported=await importExcelFile(f);speciesData=imported;localStorage.setItem('speciesDbV2',JSON.stringify(speciesData));dbCount.textContent=`登録 ${speciesData.length}種`;status.textContent=`Excel取り込み完了：${speciesData.length}種（別名を含む）`;render();}catch(err){status.textContent='Excel読み込みエラー：'+err.message;}e.target.value='';});
document.getElementById('jsonUpload').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d))throw Error('JSONは配列形式である必要があります');speciesData=toAppData(d);localStorage.setItem('speciesDbV2',JSON.stringify(speciesData));dbCount.textContent=`登録 ${speciesData.length}種`;status.textContent=`読み込み完了：${speciesData.length}種`;render();}catch(err){status.textContent='読み込みエラー：'+err.message;}e.target.value='';});
document.getElementById('downloadBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(speciesData,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='species-database.json';a.click();URL.revokeObjectURL(a.href);});
document.getElementById('resetDbBtn').addEventListener('click',()=>{speciesData=baseData.slice();localStorage.removeItem('speciesDbV2');dbCount.textContent=`登録 ${speciesData.length}種`;status.textContent='標準データに戻しました';render();});
(async()=>{try{const saved=localStorage.getItem('speciesDbV2');if(saved){speciesData=JSON.parse(saved);status.textContent='保存済みデータを読み込みました';}else{const res=await fetch('species.json');if(res.ok){speciesData=toAppData(await res.json());}else throw Error('species.json not found');}baseData=speciesData.slice();dbCount.textContent=`登録 ${speciesData.length}種`;render();}catch(e){speciesData=[{name:'スギ',category:'高木'},{name:'トベラ',category:'中木'}];baseData=speciesData.slice();dbCount.textContent=`登録 ${speciesData.length}種`;status.textContent='仮データで起動';render();}})();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
